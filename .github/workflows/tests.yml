name: Tests

on:
  push:
  pull_request:

jobs:
  fast-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests that do not require local data
        run: python -m pytest -p no:cacheprovider tests/test_model_lead.py tests/test_live_production.py
