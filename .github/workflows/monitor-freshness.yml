name: Monitor freshness

on:
  schedule:
    - cron: "0 18 * * 2"
  workflow_dispatch:

jobs:
  dashboard-freshness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check that the Monday monitor advanced
        run: python scripts/check_dashboard_freshness.py --max-age-days 21
